[project]
name = "langgraph-data_agent"
version = "0.1.0"
description = "LangGraph ReAct agent with MCP tools and pluggable LLM providers"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "duckdb>=1.0",
    "langchain-core>=0.3",
    "langchain-mcp-adapters>=0.1",
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "polars>=1.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "openpyxl>=3.1",
    "pandas>=3.0",
    "pyarrow>=25.0",
    "pymupdf>=1.28",
    "python-docx>=1.2",
    "typer>=0.27",
]

[project.optional-dependencies]
deepseek = [
    "langchain-deepseek>=0.1.0",
]
documents = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
data-agent = "data_agent.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_agent"]
