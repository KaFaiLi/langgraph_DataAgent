    <text id="cover-title-carrier" data-pptx-carrier="true" x="196" y="250"
      fill="#E60028" font-family="Arial, Microsoft YaHei, sans-serif" font-size="58"
      font-weight="700">{{TITLE}}</text>
  </g>
  <g id="cover-subtitle-slot" data-pptx-placeholder="subtitle" data-pptx-idx="1"
    data-pptx-bounds="510 365 610 58">
    <text id="cover-subtitle-carrier" data-pptx-carrier="true" x="510" y="406"
      fill="#07073F" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24"
      font-weight="700">{{SUBTITLE}}</text>
  </g>
  <g id="cover-date-slot" data-pptx-placeholder="date" data-pptx-idx="2"
