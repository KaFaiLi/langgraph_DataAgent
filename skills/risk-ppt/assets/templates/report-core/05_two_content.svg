      fill="#FFFFFF" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20">{{LEFT_CONTENT}}</text>
  </g>
  <g id="two-content-right-slot" data-pptx-placeholder="body" data-pptx-idx="2"
