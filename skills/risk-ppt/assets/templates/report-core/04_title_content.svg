<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
  data-pptx-master="report_core_content_master" data-pptx-master-name="Report Core Content"
  data-pptx-layout="title_content" data-pptx-layout-name="Title and Content">
  <rect id="master-background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <line id="master-footer-rule" x1="48" y1="666" x2="1232" y2="666" stroke="#D9D9DF"
    stroke-width="1" data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="master-brand-accent" x="48" y="680" width="6" height="18" fill="#E60028"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <text id="master-brand-label" x="64" y="694" fill="#07073F"
    font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700"
    data-pptx-layer="master" data-pptx-editable="false">INDEPENDENT RISK REVIEW</text>
  <line id="title-content-title-rule" x1="48" y1="154" x2="304" y2="154" stroke="#E60028"
    stroke-width="6" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="title-content-signal-rail" x="48" y="190" width="8" height="426" fill="#E60028"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <g id="title-content-title-slot" data-pptx-placeholder="title"
    data-pptx-bounds="48 82 1184 64">
    <text id="title-content-title-carrier" data-pptx-carrier="true" x="48" y="128"
      fill="#E60028" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38"
      font-weight="700">{{PAGE_TITLE}}</text>
  </g>
  <g id="title-content-body-slot" data-pptx-placeholder="body" data-pptx-idx="1"
    data-pptx-bounds="82 184 1110 438">
    <text id="title-content-body-carrier" data-pptx-carrier="true" x="82" y="226"
      fill="#07073F" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21">{{CONTENT_AREA}}</text>
  </g>
  <g id="title-content-footer-slot" data-pptx-placeholder="footer" data-pptx-idx="2"
    data-pptx-bounds="260 676 860 32"><text id="title-content-footer-carrier" data-pptx-carrier="true"
      x="260" y="698" fill="#6B6B78" font-family="Arial, Microsoft YaHei, sans-serif"
